name: Android APK (aláírt, kiosk)

# A native/android (Kotlin WebView-héj) projektből épít aláírt Release APK-t, és GitHub Release-t publikál.
# Az alkalmazás a Release-ből frissül (felugró ablakkal), lásd native/README.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
      version: ${{ steps.s.outputs.version }}
      code: ${{ steps.s.outputs.code }}
    steps:
      - id: s
        run: |
          echo "stamp=$(TZ=Europe/Budapest date +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"
          echo "version=$(TZ=Europe/Budapest date +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  android:
    needs: stamp
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ needs.stamp.outputs.version }}
      APP_VERSION_CODE: ${{ needs.stamp.outputs.code }}
      BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
      WEB_APP_URL: ${{ vars.WEB_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Forráshiba-ellenőrzés (literális \n a Kotlin-kódban)
        run: |
          if grep -rnF '\n' --include=*.kt native | grep -vE '"[^"]*\\n[^"]*"'; then
            echo "::error::Literális \\n szekvencia a forrásban (sortörés helyett)."; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Nincs gradlew a repóban, ezért a Gradle-t az action telepíti (AGP 8.9.2 ≥ Gradle 8.11.1).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Opcionális: a webes játék beágyazása az APK-ba (teljesen offline működés).
      # Bekapcsolás: Settings → Secrets and variables → Actions → Variables → BUNDLE_WEB = true.
      # Ha a webes build nem ad statikus index.html-t, a héj a WEB_APP_URL címet tölti be.
      - uses: oven-sh/setup-bun@v2
        if: ${{ vars.BUNDLE_WEB == 'true' }}
        continue-on-error: true

      - name: Webes csomag beágyazása (opcionális)
        if: ${{ vars.BUNDLE_WEB == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          NATIVE_BUILD=1 bun run build
          INDEX=$(find dist .output -name index.html -not -path '*/node_modules/*' 2>/dev/null | head -n1 || true)
          if [ -z "$INDEX" ]; then
            echo "::warning::A webes build nem készített statikus index.html-t; a héj a WEB_APP_URL címet tölti be."
            exit 0
          fi
          WWW=native/android/app/src/main/assets/www
          rm -rf "$WWW"; mkdir -p "$WWW"
          cp -R "$(dirname "$INDEX")"/. "$WWW"/
          echo "Beágyazva: $(dirname "$INDEX") → $WWW"

      - name: Webes forrás ellenőrzése
        run: |
          if [ -z "${WEB_APP_URL:-}" ] && [ ! -f native/android/app/src/main/assets/www/index.html ]; then
            echo "::error::Nincs mit betölteni: állítsd be a WEB_APP_URL repository variable-t (a kiadott játék HTTPS címe), vagy kapcsold be a BUNDLE_WEB=true opciót."
            exit 1
          fi

      - name: Aláírókulcs előkészítése (ha van)
        id: ks
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KS_BASE64" ] && [ -n "$KS_PASSWORD" ]; then
            KS_FILE="$RUNNER_TEMP/dragtheblox.keystore"
            printf '%s' "$KS_BASE64" | base64 -d > "$KS_FILE"
            chmod 600 "$KS_FILE"
            echo "ANDROID_KEYSTORE_FILE=$KS_FILE" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nincs Android aláírókulcs – aláíratlan Release APK készül (az nem telepíthető frissítésként)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Android release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          gradle -p native/android assembleRelease --no-daemon
          APK=$(find native/android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          mkdir -p out
          cp "$APK" "out/kockavar-${BUILD_STAMP}.apk"
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort -V | tail -n1)
            "$APKSIGNER" verify --verbose "out/kockavar-${BUILD_STAMP}.apk"
          else
            echo "::notice::A release APK aláíratlan; nincs debug build."
          fi

      - name: Kulcs törlése a futtatóról
        if: always()
        run: rm -f "$RUNNER_TEMP/dragtheblox.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  release:
    # Csak kézi indításnál vagy main-re pusholáskor, ha az Android-build sikeres.
    if: ${{ always() && needs.android.result == 'success' && github.event_name != 'pull_request' }}
    needs: [stamp, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # A címke végi futásszám egyben az APK versionCode-ja: az app ezzel dönti el, hogy van-e újabb kiadás.
          tag_name: native-${{ needs.stamp.outputs.stamp }}-${{ needs.stamp.outputs.code }}
          name: Kockavár ${{ needs.stamp.outputs.version }}
          prerelease: false
          make_latest: true
          body: |
            Kockavár Android · ${{ needs.stamp.outputs.version }} (#${{ needs.stamp.outputs.code }})
            Aláírt Release APK (kulcs nélkül aláíratlan; debug build nincs). Az app az újabb kiadást felugró ablakban ajánlja fel.
          files: out/*
