name: Android APK (aláírt, kiosk)

# A játékot önálló, offline csomagként építi (native-web/ + vite.native.config.ts), beágyazza a native/android
# (Kotlin WebView-héj) projektbe, és aláírt Release APK-t publikál GitHub Release-ként. A játékhoz nem kell internet.
# Az alkalmazás a Release-ből frissül (felugró ablakkal), lásd native/README.md.
# Játék- vagy forrásmódosítás után: Actions → Run workflow (a src/** módosítása nem indítja magától).
#
# Az aláírókulcs egyszer készül el, kézi titok (secret) nélkül: az első futás RSA-4096 kulcsot generál, és
# AES-256-CBC/PBKDF2 titkosítva a `signing` ágra menti a jelszavával együtt; a későbbi build-ek onnan töltik vissza.
# FIGYELEM: a jelszó a `signing` ágon van, ezért a kulcs védelme a tároló hozzáférési jogain múlik.
# A `signing` ágat soha ne töröld és ne írd felül: más kulccsal aláírt APK nem frissítheti a telepített appot.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "native-web/**"
      - "vite.native.config.ts"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

# Egyszerre csak egy futás: a kulcs létrehozása nem versenghet saját magával.
concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
      version: ${{ steps.s.outputs.version }}
      code: ${{ steps.s.outputs.code }}
    steps:
      - id: s
        run: |
          echo "stamp=$(TZ=Europe/Budapest date +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"
          echo "version=$(TZ=Europe/Budapest date +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  android:
    needs: stamp
    runs-on: ubuntu-latest
    permissions:
      contents: write # a signing ág létrehozásához (csak az első futásnál ír)
    env:
      APP_VERSION_NAME: ${{ needs.stamp.outputs.version }}
      APP_VERSION_CODE: ${{ needs.stamp.outputs.code }}
      BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4

      - name: Forráshiba-ellenőrzés (literális \n a Kotlin-kódban)
        run: |
          if grep -rnF '\n' --include=*.kt native | grep -vE '"[^"]*\\n[^"]*"'; then
            echo "::error::Literális \\n szekvencia a forrásban (sortörés helyett)."; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Nincs gradlew a repóban, ezért a Gradle-t az action telepíti (AGP 8.9.2 ≥ Gradle 8.11.1).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # A játék offline csomagja: nincs SSR, nincs router, nincs hálózat. Ez kerül az APK-ba (assets/www).
      - uses: oven-sh/setup-bun@v2

      - name: Játék beágyazása (offline csomag)
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build:native
          test -f dist-native/index.html || { echo "::error::A webes build nem készített dist-native/index.html-t."; exit 1; }
          WWW=native/android/app/src/main/assets/www
          rm -rf "$WWW"; mkdir -p "$WWW"
          cp -R dist-native/. "$WWW"/
          echo "Beágyazva: dist-native → $WWW ($(du -sh "$WWW" | cut -f1))"
          # Offline-ellenőrzés: a csomag nem hivatkozhat külső címre (betűtípus, CDN, analitika).
          if grep -rEl 'https?://(fonts\.googleapis|fonts\.gstatic|cdn\.|unpkg|cdnjs)' "$WWW" >/dev/null 2>&1; then
            echo "::warning::A csomag külső címre hivatkozik; az app tiltja a külső kéréseket, de nézd át: grep -r 'https://' dist-native"
          fi

      - name: Aláírókulcs létrehozása vagy visszatöltése a signing ágról
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KS_FILE="$RUNNER_TEMP/dragtheblox.keystore"
          ENC_FILE="$RUNNER_TEMP/dragtheblox.keystore.enc"

          if git ls-remote --exit-code --heads origin signing >/dev/null 2>&1; then
            echo "Meglévő signing ág megtalálva; a korábbi kulcsot töltöm vissza."
            git fetch --depth=1 origin signing
            KS_PASS="$(git show FETCH_HEAD:keystore.pass)"
            echo "::add-mask::$KS_PASS"
            export KS_PASS
            test "${#KS_PASS}" -ge 12 || {
              echo "::error::A signing ágon tárolt kulcsjelszó hiányzik vagy hibás."
              exit 1
            }
            git show FETCH_HEAD:release.keystore.enc > "$ENC_FILE"
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:KS_PASS -in "$ENC_FILE" -out "$KS_FILE" 2>/dev/null \
               || ! keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" -alias dragtheblox >/dev/null 2>&1; then
              rm -f "$KS_FILE"
              echo "::error::A signing ágon lévő kulcs nem fejthető vissza. A signing ágat nem írom felül; a mentést külön kell megvizsgálni."
              exit 1
            fi
          else
            echo "Nincs signing ág; egyszeri RSA-4096 kulcsot hozok létre."
            KS_PASS="$(openssl rand -hex 32)"
            echo "::add-mask::$KS_PASS"
            export KS_PASS
            keytool -genkeypair -storetype PKCS12 -keystore "$KS_FILE" \
              -alias dragtheblox -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -keyalg RSA -keysize 4096 -validity 36525 \
              -dname "CN=Kockavar, C=HU"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:KS_PASS -in "$KS_FILE" -out "$ENC_FILE"

            SIGN_DIR="$(mktemp -d)"
            cp "$ENC_FILE" "$SIGN_DIR/release.keystore.enc"
            printf '%s' "$KS_PASS" > "$SIGN_DIR/keystore.pass"
            (
              cd "$SIGN_DIR"
              git init -q -b signing
              git config user.name "github-actions"
              git config user.email "github-actions@users.noreply.github.com"
              git add release.keystore.enc keystore.pass
              git commit -q -m "Create Kockavar Android signing key"
              git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" signing
            )
            rm -rf "$SIGN_DIR"
            echo "::notice::Az új aláírókulcs elkészült és a signing ágra került."
          fi

          chmod 600 "$KS_FILE"
          {
            echo "ANDROID_KEYSTORE_FILE=$KS_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_ALIAS=dragtheblox"
          } >> "$GITHUB_ENV"
          keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" -alias dragtheblox >/dev/null
          echo "Az aláírókulcs készen áll."

      - name: Android release APK
        run: |
          set -euo pipefail
          gradle -p native/android assembleRelease --no-daemon
          APK=$(find native/android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          mkdir -p out
          cp "$APK" "out/kockavar-${BUILD_STAMP}.apk"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose "out/kockavar-${BUILD_STAMP}.apk"

      - name: Kulcs törlése a futtatóról
        if: always()
        run: rm -f "$RUNNER_TEMP/dragtheblox.keystore" "$RUNNER_TEMP/dragtheblox.keystore.enc"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  release:
    if: ${{ needs.android.result == 'success' }}
    needs: [stamp, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # A címke végi futásszám egyben az APK versionCode-ja: az app ezzel dönti el, hogy van-e újabb kiadás.
          tag_name: native-${{ needs.stamp.outputs.stamp }}-${{ needs.stamp.outputs.code }}
          name: Kockavár ${{ needs.stamp.outputs.version }}
          prerelease: false
          make_latest: true
          body: |
            Kockavár Android · ${{ needs.stamp.outputs.version }} (#${{ needs.stamp.outputs.code }})
            Aláírt Release APK. Az app az újabb kiadást felugró ablakban ajánlja fel (azonos kulccsal aláírva, ezért felülírja a régit).
          files: out/*
